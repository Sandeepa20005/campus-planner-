name: Build Unsigned iOS IPA with Production Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Artifact
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install All Dependencies (Including TS)
        run: npm install

      - name: Compile TypeScript & Create Production Build
        run: |
          # Run the build script defined in your package.json (Vite/React/etc.)
          npm run build --if-present
          
          # If build folder is created as 'dist' or 'build', rename/copy to 'www'
          if [ -d "dist" ]; then
            mv dist www
          elif [ -d "build" ]; then
            mv build www
          fi
          
          # Fallback check to ensure 'www' folder exists with index.html
          if [ ! -d "www" ] || [ ! -f "www/index.html" ]; then
            echo "Production build failed or index.html not found in www/dist/build!"
            exit 1
          fi

      - name: Install Specific Capacitor Version
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6

      - name: Initialize Capacitor Project
        run: npx cap init "Campus Planner" "com.campus.studyplanner" --web-dir=www

      - name: Add iOS Platform
        run: npx cap add ios

      - name: Sync Production Compiled Code to iOS Shell
        run: npx cap sync ios

      - name: Build Unsigned IPA via Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build
          
          mkdir -p build/Release-iphoneos/Payload
          mv build/Release-iphoneos/App.app build/Release-iphoneos/Payload/
          cd build/Release-iphoneos
          zip -r ../../CampusPlanner.ipa Payload

      - name: Upload Unsigned IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Planner-Unsigned-IPA
          path: ios/App/CampusPlanner.ipa
